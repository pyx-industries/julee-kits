services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgres
    ports:
      - "7234:7233"
      - "8233:8233"

  temporal-ui:
    image: temporalio/ui:2.10.3
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8001:8080"

  minio:
    # Not minio/minio. MinIO withdrew its public distribution during
    # 2025: the Docker Hub repository is gone, quay.io answers 401 to an
    # anonymous pull, and dl.min.io answers 410. Nobody without an
    # account could bring this stack up.
    #
    # This is a community mirror, pinned by digest because a tag on
    # someone else's registry is not a thing to take on trust. It is a
    # rebuild from source rather than a republished official artifact —
    # it reports commit-id=DEVELOPMENT.GOGET — so the reason to use it
    # is evidence rather than provenance: julee's MinIO contract suite
    # passes against this digest, all 34 assertions about what MinIO
    # does, run with `make test-contract` in julee against it.
    #
    # RELEASE.2025-10-15T17-29-55Z
    image: ghcr.io/coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 3

  julee-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    depends_on:
      temporal:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      - TEMPORAL_ENDPOINT=temporal:7233
      - MINIO_ENDPOINT=minio:9000
      - LOG_LEVEL=INFO
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import temporalio; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3

  julee-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    depends_on:
      temporal:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      - TEMPORAL_ENDPOINT=temporal:7233
      - MINIO_ENDPOINT=minio:9000
      - LOG_LEVEL=INFO
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    ports:
      - "8000:8000"
    restart: on-failure

  julee-ui:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ui
    depends_on:
      - julee-api
    environment:
      - VITE_GEMINI_API_KEY=${GEMINI_API_KEY}
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    restart: on-failure

volumes:
  postgres-data:
  minio-data:
