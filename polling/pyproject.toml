[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "julee-polling"
version = "0.2.0"
description = "Polling for julee solutions: watch an external endpoint for new data"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Pyx Industries", email = "chris@pyx.io"}
]
keywords = ["julee", "polling", "temporal"]

dependencies = [
    # The kit needs julee's Entity and Acknowledgement, and its Temporal
    # integration for the pipeline and activity decorators.
    "julee[temporal]>=0.9,<0.10",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "mypy>=1.7.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
    "julee[doctrine]>=0.9,<0.10",
]

# A kit announces itself here. Installing it does not activate it; a
# solution adopts it in [tool.julee] kits.
[project.entry-points."julee.kits"]
polling = "julee_polling:kit"

# PEP 561: the kit is typed.
[tool.setuptools.package-data]
julee_polling = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["julee_polling*"]

[tool.julee]
# This kit is a julee solution in its own right, and runs its own doctrine.
# The package itself is the bounded context, so discovery starts above it.
search_root = "src"
