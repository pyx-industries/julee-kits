# Workspace root for julee-kits. It ships nothing itself; each kit is its
# own distribution in its own directory.

[tool.uv.workspace]
members = ["c4", "ceap", "hcd", "polling", "viewpoints"]

[tool.uv]
package = false

[tool.ruff]
# Ruff is used for linting only. Formatting is handled by black.
line-length = 88
target-version = "py311"
exclude = [".git", ".venv", "__pycache__", "*.pyc", ".pytest_cache", ".mypy_cache"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = [
    "E501",  # line too long (handled by the formatter)
    "B008",  # function calls in argument defaults
    "B904",  # raise from
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["B"]

[tool.ruff.lint.isort]
known-first-party = [
    "julee_c4",
    "julee_ceap",
    "julee_hcd",
    "julee_polling",
    "julee_viewpoints",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "temporalio.*",
    # Untyped, with no published stubs
    "jsonpointer",
    "multihash",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Recent Sphinx uses Python 3.12 syntax, which mypy rejects when checking
# for 3.11; the plantuml extension ships no stubs.
module = [
    "sphinx.*",
    "sphinxcontrib.*",
]
follow_imports = "skip"
ignore_missing_imports = true

# Same settings as julee's, so a kit is type-checked as strictly as the
# framework: constructor calls are checked against the model's fields.
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["c4/src", "ceap/src", "hcd/src", "polling/src", "viewpoints/src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--tb=short",
    # A test that stops making progress fails rather than holding the machine
    "--timeout=300",
    "-n", "auto",
    "--dist", "loadgroup",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, with dependencies)",
    "e2e: End-to-end tests (slowest, full stack)",
    "slow: Slow tests (stress tests, load tests)",
]
