[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "julee-viewpoints"
version = "0.4.2"
description = "Code-outward documentation for julee solutions"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Pyx Industries", email = "chris@pyx.io"}
]
keywords = ["julee", "sphinx", "documentation", "human-centred-design"]

dependencies = [
    # [doctrine] for griffe: this kit reads a solution's code to document
    # it, which is the whole point of it, and that is where the reader
    # lives.
    "julee[doctrine]>=0.9,<0.10",
    # The domain this kit renders. It holds no entities of its own: hcd
    # says what a persona is, c4 says what a container is, and this kit
    # projects both into documentation.
    "julee-hcd>=0.2,<0.3",
    "julee-c4>=0.1.1,<0.2",
    "sphinx>=7.0.0",
]

# A kit announces itself to the framework here. Installing it does not
# activate it; a solution adopts it in [tool.julee] kits.
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "mypy>=1.7.0",
    "types-docutils",
    "types-PyYAML",
    "black>=24.0.0",
    "ruff>=0.5.0",
    "julee[doctrine]>=0.9,<0.10",
]

[project.entry-points."julee.kits"]
viewpoints = "julee_viewpoints:kit"

# PEP 561: the kit is typed too.
[tool.setuptools.package-data]
julee_viewpoints = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["julee_viewpoints*"]

[tool.julee]
# This kit is a julee solution in its own right, and runs its own doctrine.
# It has no bounded contexts of its own: WS7 moved its domain into
# julee-hcd and julee-c4, leaving a Sphinx projection over both. Said out
# loud, because a run with nothing to check passes every rule that
# iterates contexts and reads exactly like one that complies (julee #240).
search_root = "src/julee_viewpoints"
bounded_contexts = "none"
docs_root = "docs"

# It is also the only kit that reads two others, so it adopts them the
# way a solution would. Without this, doctrine sees hcd and c4 as kits
# this codebase imports without having adopted.
kits = ["hcd", "c4"]

# Its composition roots are not called apps/. Each sphinx/context.py
# chooses the memory repositories and wires them into adapters, attached
# to the Sphinx application at builder-inited: a composition root by
# every test except its name. Needs julee >= 0.5.14.
composition_roots = ["sphinx_hcd/sphinx", "sphinx_c4/sphinx"]

# Within this workspace the two kits are the sibling directories, not
# whatever is on PyPI. The published wheel carries the version
# constraints above; this only decides what a checkout builds against.
[tool.uv.sources]
julee-hcd = { workspace = true }
julee-c4 = { workspace = true }
